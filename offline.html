<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F4F0E7">
  <meta name="robots" content="noindex,nofollow">
  <title>Нет соединения — Tools for your work</title>
  <link rel="icon" type="image/svg+xml" href="/custom-tools-studio/favicon.svg">
  <link rel="manifest" href="/custom-tools-studio/manifest.webmanifest">
  <link rel="stylesheet" href="/custom-tools-studio/styles.css">
  <style>
    .offline-shell{min-height:100vh;display:grid;place-items:center;padding:32px}
    .offline-card{width:min(100%,720px);padding:clamp(30px,6vw,64px);border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow)}
    .offline-card h1{margin:10px 0 18px;font-size:clamp(46px,7vw,82px);line-height:.95;letter-spacing:-.06em}
    .offline-card p{max-width:580px;color:var(--muted);font-size:18px;line-height:1.65}
    .offline-mark{display:flex;align-items:center;gap:10px;margin-bottom:24px}
    .offline-mark i{display:block;border-radius:50%}
    .offline-mark i:first-child{width:28px;height:28px;background:var(--yellow)}
    .offline-mark span{width:38px;height:3px;background:var(--ink);transform:rotate(35deg);border-radius:99px}
    .offline-mark i:last-child{width:20px;height:20px;background:var(--blue)}
  </style>
</head>
<body>
  <main class="offline-shell">
    <section class="offline-card">
      <div class="offline-mark" aria-hidden="true"><i></i><span></span><i></i></div>
      <div class="eyebrow">offline</div>
      <h1>Сейчас нет соединения.</h1>
      <p>Основные страницы уже сохранены на устройстве. Для свежих проектов, медиа и отправки заявки понадобится интернет.</p>
      <button class="btn primary" type="button" onclick="location.reload()">Попробовать снова</button>
    </section>
  </main>
</body>
</html>
