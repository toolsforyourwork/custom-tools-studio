<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Админка — Tools for your work</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card" id="login-view">
      <div class="admin-mark" aria-hidden="true">
        <span class="admin-dot admin-dot-yellow"></span>
        <span class="admin-line"></span>
        <span class="admin-dot admin-dot-blue"></span>
      </div>
      <p class="eyebrow">Закрытая зона</p>
      <h1>Админка проектов</h1>
      <p class="admin-lead">Управление проектами студии. Публичной регистрации здесь нет.</p>

      <form id="login-form" class="admin-form">
        <label>
          <span>Email</span>
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label>
          <span>Пароль</span>
          <input id="password" type="password" autocomplete="current-password" required minlength="10">
        </label>
        <button class="button admin-submit" type="submit">Войти</button>
      </form>

      <p class="admin-status" id="login-status" role="status"></p>
      <a class="admin-back" href="../index.html">← На сайт</a>
    </section>

    <section class="admin-dashboard is-hidden" id="dashboard-view">
      <header class="admin-topbar">
        <div>
          <p class="eyebrow">Панель управления</p>
          <h1>Проекты</h1>
          <p class="admin-user" id="admin-user"></p>
        </div>
        <div class="admin-top-actions">
          <a class="admin-ghost" href="../projects.html" target="_blank" rel="noopener">Открыть сайт</a>
          <button class="admin-ghost" id="logout-button" type="button">Выйти</button>
        </div>
      </header>

      <div class="admin-summary">
        <div class="admin-summary-card">
          <strong id="projects-count">—</strong>
          <span>всего проектов</span>
        </div>
        <div class="admin-summary-card">
          <strong id="published-count">—</strong>
          <span>опубликовано</span>
        </div>
        <div class="admin-summary-card">
          <strong id="draft-count">—</strong>
          <span>черновиков</span>
        </div>
      </div>

      <section class="admin-editor is-hidden" id="editor-panel">
        <div class="admin-panel-head">
          <div>
            <p class="eyebrow" id="editor-eyebrow">Новый проект</p>
            <h2 id="editor-title">Добавить проект</h2>
          </div>
          <button class="admin-ghost" id="cancel-edit" type="button">Закрыть</button>
        </div>

        <form id="project-form" class="project-form">
          <input id="project-id" type="hidden">

          <div class="form-grid form-grid-two">
            <label>
              <span>Название *</span>
              <input id="project-title" type="text" maxlength="160" required placeholder="Например, AI-пайплайн для студии">
            </label>
            <label>
              <span>Slug *</span>
              <input id="project-slug" type="text" maxlength="160" required placeholder="ai-pipeline">
            </label>
          </div>

          <div class="form-grid form-grid-three">
            <label>
              <span>Тип</span>
              <input id="project-type" type="text" maxlength="100" placeholder="Автоматизация / Web / AI">
            </label>
            <label>
              <span>Статус</span>
              <select id="project-status">
                <option value="concept">Концепт</option>
                <option value="in_progress" selected>В работе</option>
                <option value="paused">Пауза</option>
                <option value="completed">Готов</option>
              </select>
            </label>
            <label>
              <span>Порядок</span>
              <input id="project-sort-order" type="number" value="0" step="1">
            </label>
          </div>

          <label>
            <span>Короткое описание</span>
            <textarea id="project-short-description" rows="3" maxlength="600" placeholder="Пара предложений для карточки проекта"></textarea>
          </label>

          <label>
            <span>Полное описание</span>
            <textarea id="project-description" rows="7" maxlength="12000" placeholder="Задача, решение, процесс, результат"></textarea>
          </label>

          <label>
            <span>Ссылка на обложку</span>
            <input id="project-cover-url" type="url" maxlength="2000" placeholder="https://...">
            <small>На следующем этапе заменим это поле на загрузку файла прямо из админки.</small>
          </label>

          <label class="publish-toggle">
            <input id="project-published" type="checkbox">
            <span>
              <strong>Опубликовать</strong>
              <small>Проект сразу появится на публичной странице.</small>
            </span>
          </label>

          <div class="editor-actions">
            <button class="button" id="save-project" type="submit">Сохранить проект</button>
            <button class="admin-ghost" id="cancel-edit-bottom" type="button">Отмена</button>
          </div>

          <p class="admin-status" id="editor-status" role="status"></p>
        </form>
      </section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <div>
            <p class="eyebrow">База проектов</p>
            <h2>Все проекты</h2>
          </div>
          <div class="admin-panel-actions">
            <button class="admin-ghost" id="refresh-button" type="button">Обновить</button>
            <button class="button" id="new-project-button" type="button">+ Новый проект</button>
          </div>
        </div>

        <div id="projects-list" class="admin-projects"></div>
        <p class="admin-status" id="dashboard-status" role="status"></p>
      </section>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
