name: Production QA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "admin/**"
      - "client/**"
      - ".github/scripts/qa.mjs"
      - ".github/workflows/qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check project.js
          node --check client/client.js
          node --check admin/admin.js
          node --check sw.js

      - name: Static QA
        run: node .github/scripts/qa.mjs

      - name: Production QA
        if: github.event_name == 'workflow_dispatch'
        env:
          QA_PRODUCTION: "1"
        run: node .github/scripts/qa.mjs
