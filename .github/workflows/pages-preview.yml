name: GitHub Pages preview

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pages-preview.yml'
      - '.github/workflows/update-sitemap.yml'
      - '.github/scripts/generate-site-index.ps1'
      - 'project.html'

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      SITE_DIR: ${{ runner.temp }}/pages-preview
      QA_PRODUCTION: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Copy tracked site files
        shell: bash
        run: |
          mkdir -p "$SITE_DIR"
          git archive --format=tar HEAD | tar --exclude=.github -xf - -C "$SITE_DIR"

      - name: Generate and check sample case
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'pages-preview-projects.json'
          @{
            projects = @(@{
              slug = 'qa-preview-case'
              title = 'Preview & QA'
              short_description = 'Sample case for the Pages build.'
              updated_at = '2026-01-01T00:00:00Z'
            })
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $fixture -Encoding utf8

          ./.github/scripts/generate-site-index.ps1 -SiteDirectory $env:SITE_DIR -ProjectsJsonPath $fixture

          $caseFile = Join-Path $env:SITE_DIR 'case/qa-preview-case/index.html'
          $casePage = Get-Content -LiteralPath $caseFile -Raw
          if (-not $casePage.Contains('<title>Preview &amp; QA — Tools for your work</title>')) {
            throw 'Generated case is missing its escaped title.'
          }
          if (-not $casePage.Contains('window.PROJECT_SLUG="qa-preview-case"')) {
            throw 'Generated case is missing its project slug.'
          }
          if (-not $casePage.Contains('/functions/v1/og-image?slug=qa-preview-case"')) {
            throw 'Generated case is missing its share image URL.'
          }

          [xml] $sitemap = Get-Content -LiteralPath (Join-Path $env:SITE_DIR 'sitemap.xml') -Raw
          $caseUrl = 'https://toolsforyourwork.github.io/custom-tools-studio/case/qa-preview-case/'
          if ($caseUrl -notin $sitemap.urlset.url.loc) {
            throw 'Generated sitemap is missing the sample case URL.'
          }

      - name: Check packaged site
        shell: bash
        run: |
          cd "$SITE_DIR"
          node "$GITHUB_WORKSPACE/.github/scripts/qa.mjs"

      - name: Upload Pages preview
        uses: actions/upload-pages-artifact@v4
        with:
          name: pages-preview
          path: ${{ env.SITE_DIR }}
          retention-days: 7
