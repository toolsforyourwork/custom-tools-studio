name: Production health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monitor.yml"

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check production
        id: check
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $siteUrl = "https://toolsforyourwork.github.io/custom-tools-studio/"
          $healthUrl = "https://bpdqosfgxqawbzljafgb.supabase.co/functions/v1/health-check"

          $site = Invoke-WebRequest -Uri $siteUrl -UseBasicParsing -TimeoutSec 25
          if ($site.StatusCode -ne 200) {
            throw "Website returned HTTP $($site.StatusCode)"
          }

          try {
            $health = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 35
          }
          catch {
            throw "Health endpoint failed: $($_.Exception.Message)"
          }

          if (-not $health.ok) {
            $details = $health | ConvertTo-Json -Depth 6 -Compress
            throw "Health check reported a failure: $details"
          }

          Write-Host "Site: OK"
          Write-Host "Database: $($health.checks.database.ok)"
          Write-Host "Content API: $($health.checks.content.ok)"
          Write-Host "Client Portal: $($health.checks.client_portal.ok)"
          Write-Host "Client Registration: $($health.checks.client_register.ok)"
          Write-Host "Admin CRM: $($health.checks.admin_crm.ok)"
          Write-Host "Form: $($health.checks.form.ok)"
          Write-Host "Telegram: $($health.checks.telegram.ok)"

      - name: Open or update incident issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] Production health check failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Автоматический мониторинг обнаружил проблему.',
              '',
              `Проверка: ${new Date().toISOString()}`,
              `Workflow: ${runUrl}`,
              '',
              'Проверяются: GitHub Pages, Supabase/БД, Content API, клиентский API, регистрацию клиентов, endpoint формы заявки и Telegram webhook.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close recovered incident
        if: steps.check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[monitor] Production health check failed';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Система снова отвечает штатно. Восстановление зафиксировано: ${new Date().toISOString()}`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Mark workflow failed
        if: steps.check.outcome == 'failure'
        shell: pwsh
        run: |
          throw "Production health check failed. Incident issue was created or updated."
