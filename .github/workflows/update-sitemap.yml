name: Update sitemap and case share pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-site-index:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate sitemap and case pages
        shell: pwsh
        run: ./.github/scripts/generate-site-index.ps1 -SiteDirectory $PWD.Path

      - name: Commit generated files if changed
        shell: pwsh
        run: |
          git add sitemap.xml case
          if (-not (git diff --cached --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update sitemap and case share pages"
            git push
          }
